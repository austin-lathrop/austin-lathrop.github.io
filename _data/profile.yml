about:
  - I'm a journalism student at the University of Georgia's Grady College of
    Journalism, minoring in public affairs, and I report on agriculture, rural
    communities and the environment for The Oglethorpe Echo and Grady Newsource.
  - Before reporting, I spent two summers in Washington, D.C., including an
    internship with the U.S. House Oversight and Accountability Committee. I
    know how hearings, rulemakings and public records work, and I bring that to
    local stories.
  - My stories start with the people closest to an issue, like ranchers,
    teachers and county staff, and back them up with federal data. I shoot my
    own photos and build my own charts.
