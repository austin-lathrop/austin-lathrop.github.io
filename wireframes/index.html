<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --table: #dfe2e6;
    --ink: #202326;
    --ink-2: #5e636b;
    --rule: #b9bec5;
    --blue: #2b78c4;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--table); color: var(--ink); font-family: "Public Sans", system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; padding: 20px 32px; }
  .bar h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .bar p { margin: 0; font-size: 0.875rem; color: var(--ink-2); max-width: 52ch; }
  .controls { margin-left: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .seg button {
    font: 600 0.875rem "Public Sans", sans-serif; padding: 8px 14px; border: 0; background: var(--paper); color: var(--ink); cursor: pointer;
  }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--blue); font-style: italic; cursor: pointer; }
  .toggle input { accent-color: var(--blue); width: 16px; height: 16px; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; padding: 0 32px 40px; align-items: start; }
  .frame h2 { font-size: 0.875rem; font-weight: 600; margin: 0 0 8px; display: flex; gap: 12px; align-items: baseline; }
  .frame h2 span { font-weight: 400; color: var(--ink-2); }
  .frame h2 a { margin-left: auto; font-weight: 400; color: var(--ink-2); }
  .viewport { position: relative; overflow: hidden; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 1px 0 var(--rule); }
  .viewport iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: var(--paper); }
  .phone .viewport { border-radius: 20px; border: 8px solid var(--ink); }

  @media (max-width: 960px) {
    .bar { padding: 16px; }
    .controls { margin-left: 0; }
    .stage { grid-template-columns: 1fr; padding: 0 16px 32px; }
    .phone { max-width: 360px; }
  }
</style>
</head>
<body>
  <div class="bar">
    <h1>Portfolio wireframes</h1>
    <p>Grayscale layout and structure only. Blue notes explain each decision. Both frames are live pages: scroll inside them and click a story or photo essay.</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Page">
        <button type="button" data-page="home.html" aria-pressed="true">Home</button>
        <button type="button" data-page="story-beef-prices.html" aria-pressed="false">Story</button>
        <button type="button" data-page="essay.html" aria-pressed="false">Photo essay</button>
      </div>
      <label class="toggle"><input type="checkbox" id="notes" checked> Show notes</label>
    </div>
  </div>

  <main class="stage">
    <section class="frame desk">
      <h2>Desktop <span>1280 wide</span> <a id="open" href="home.html" target="_blank">Open full page</a></h2>
      <div class="viewport" data-w="1280" data-h="820"><iframe title="Desktop wireframe" src="home.html"></iframe></div>
    </section>
    <section class="frame phone">
      <h2>Phone <span>390 wide</span></h2>
      <div class="viewport" data-w="390" data-h="844"><iframe title="Phone wireframe" src="home.html"></iframe></div>
    </section>
  </main>

<script>
  const viewports = [...document.querySelectorAll(".viewport")];
  const frames = viewports.map((v) => v.querySelector("iframe"));
  const notes = document.getElementById("notes");
  const open = document.getElementById("open");

  function fit(v) {
    const w = +v.dataset.w, h = +v.dataset.h;
    const inner = v.clientWidth;
    const s = Math.min(1, inner / w);
    const f = v.querySelector("iframe");
    f.style.width = w + "px";
    f.style.height = h + "px";
    f.style.transform = `scale(${s})`;
    v.style.height = h * s + "px";
  }
  const ro = new ResizeObserver(() => viewports.forEach(fit));
  viewports.forEach((v) => ro.observe(v));

  function sendNotes() {
    frames.forEach((f) => f.contentWindow && f.contentWindow.postMessage({ notes: notes.checked }, "*"));
  }
  frames.forEach((f) => f.addEventListener("load", sendNotes));
  notes.addEventListener("change", sendNotes);

  document.querySelectorAll(".seg button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      frames.forEach((f) => (f.src = b.dataset.page));
      open.href = b.dataset.page;
    });
  });
</script>
</body>
</html>
